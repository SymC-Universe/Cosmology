name: Cosmology synchronized scalar-Weyl resolution ladder

on:
  push:
    branches:
      - dark-sector-stability-architecture
    paths:
      - 'dark_sector_architecture/qualification/run_qr2_resolution_pair.py'
      - 'dark_sector_architecture/qualification/run_scalar_weyl_slip_probe.py'
      - 'dark_sector_architecture/qualification/fourier_resolution.py'
      - 'dark_sector_architecture/qualification/weak_field_tensors.py'
      - 'dark_sector_architecture/qualification/gevolution_modal_pilot.ini'
      - '.github/workflows/cosmology-synchronized-weyl-ladder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cosmology-synchronized-weyl-ladder
  cancel-in-progress: true

jobs:
  synchronized-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GEVOLUTION_SHA: 0cca42e51a824002ae4fb602cbd79d671e8ffe60
      LATFIELD2_SHA: 2d8c737ab6adc965a1d2718c209f5085af27b09c
      TEMPLATE_BLOB: d4de9a5400ef58f6a0181fbe61f18056b233a425
      BOXSIZE: 64.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: dark-sector-stability-architecture

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            openmpi-bin \
            libopenmpi-dev \
            libfftw3-dev \
            libgsl-dev \
            libhdf5-dev
          python -m pip install --upgrade pip
          python -m pip install numpy h5py

      - name: Fetch pinned gevolution and canonical CPU LATfield2
        run: |
          git clone https://github.com/gevolution-code/gevolution-1.3.git gevolution
          git -C gevolution checkout "$GEVOLUTION_SHA"
          git clone https://gitlab.uzh.ch/julian.adamek/LATfield2.git LATfield2
          git -C LATfield2 checkout "$LATFIELD2_SHA"
          printf 'gevolution=%s\nLATfield2=%s\n' \
            "$(git -C gevolution rev-parse HEAD)" \
            "$(git -C LATfield2 rev-parse HEAD)" \
            | tee synchronized_upstream_revisions.txt

      - name: Fetch and verify canonical sc1 particle template
        run: |
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/gevolution-code/gevolution-1.2/df8a930732aae1bafa32fd839ee70728bb10773a/sc1_crystal.dat \
            -o gevolution/sync_template.dat
          test "$(git hash-object gevolution/sync_template.dat)" = "$TEMPLATE_BLOB"

      - name: Compile gevolution with velocity output
        working-directory: gevolution
        run: |
          make clean
          make -j2 \
            INCLUDE="-I../LATfield2 -I/usr/include/hdf5/serial" \
            LIB="-lfftw3 -lm -L/usr/lib/x86_64-linux-gnu/hdf5/serial -lhdf5 -lgsl -lgslcblas" \
            DGEVOLUTION="-DPHINONLINEAR -DBENCHMARK -DEXACT_OUTPUT_REDSHIFTS -DVELOCITY"
          test -x gevolution

      - name: Build synchronized ladder settings
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path(
              "dark_sector_architecture/qualification/gevolution_modal_pilot.ini"
          ).read_text()

          def settings(n, tiling, tag):
              text = base
              replacements = {
                  "template file = pilot_template.dat": "template file = sync_template.dat",
                  "tiling factor = 2": f"tiling factor = {tiling}",
                  "Ngrid = 8": f"Ngrid = {n}",
                  "time step limit = 0.04": "time step limit = 0.02",
                  "output path = ../pilot_output/": f"output path = ../sync_{tag}_output/",
                  "generic file base = modalpilot": f"generic file base = sync_{tag}",
                  "snapshot file base = modalpilot_snap": f"snapshot file base = sync_{tag}_snap",
                  "Pk file base = modalpilot_pk": f"Pk file base = sync_{tag}_pk",
              }
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f"missing expected settings token: {old}")
                  text = text.replace(old, new, 1)
              return text

          for n, tiling in ((8, 2), (16, 4), (32, 8), (64, 16)):
              Path(f"gevolution/sync_n{n}.ini").write_text(
                  settings(n, tiling, f"n{n}")
              )
          PY

      - name: Run N8 synchronized member
        run: |
          set -o pipefail
          mkdir -p sync_n8_output
          cd gevolution
          mpirun --oversubscribe -np 4 ./gevolution -n 2 -m 2 -s sync_n8.ini \
            | tee ../sync_n8.log

      - name: Run N16 synchronized member
        run: |
          set -o pipefail
          mkdir -p sync_n16_output
          cd gevolution
          mpirun --oversubscribe -np 4 ./gevolution -n 2 -m 2 -s sync_n16.ini \
            | tee ../sync_n16.log

      - name: Run N32 synchronized member
        run: |
          set -o pipefail
          mkdir -p sync_n32_output
          cd gevolution
          mpirun --oversubscribe -np 4 ./gevolution -n 2 -m 2 -s sync_n32.ini \
            | tee ../sync_n32.log

      - name: Run N64 synchronized member
        run: |
          set -o pipefail
          mkdir -p sync_n64_output
          cd gevolution
          mpirun --oversubscribe -np 4 ./gevolution -n 2 -m 2 -s sync_n64.ini \
            | tee ../sync_n64.log

      - name: Verify one shared output epoch and required fields
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"writing snapshot at z = ([0-9eE+.-]+)")
          epochs = {}
          for n in (8, 16, 32, 64):
              tag = f"n{n}"
              text = Path(f"sync_{tag}.log").read_text()
              match = pattern.search(text)
              if match is None:
                  raise SystemExit(f"no snapshot epoch found for {tag}")
              epochs[tag] = float(match.group(1))
              for token in ("_phi.h5", "_chi.h5", "_v.h5", "_B.h5", "_hij.h5"):
                  files = list(Path(f"sync_{tag}_output").glob(f"*{token}"))
                  if not files:
                      raise SystemExit(f"missing {tag} {token}")
          print("synchronized epochs:", epochs)
          if max(epochs.values()) - min(epochs.values()) > 1e-12:
              raise SystemExit(f"ladder epochs do not match: {epochs}")
          Path("synchronized_epoch.txt").write_text(
              f'{epochs["n8"]:.17g}\n'
          )
          PY

      - name: Run slip-corrected scalar Weyl probes at all resolutions
        run: |
          for n in 8 16 32 64; do
            phi="$(find sync_n$n"_output" -type f -name '*_phi.h5' | head -n 1)"
            chi="$(find sync_n$n"_output" -type f -name '*_chi.h5' | head -n 1)"
            python dark_sector_architecture/qualification/run_scalar_weyl_slip_probe.py \
              --phi "$phi" \
              --chi "$chi" \
              --boxsize "$BOXSIZE" \
              --output "dark_sector_architecture/qualification/results/scalar_weyl_slip_n$n.json"
          done

      - name: Run slip-aware adjacent resolution comparisons
        run: |
          compare_pair () {
            low="$1"
            high="$2"
            low_phi="$(find sync_n$low"_output" -type f -name '*_phi.h5' | head -n 1)"
            low_chi="$(find sync_n$low"_output" -type f -name '*_chi.h5' | head -n 1)"
            low_v="$(find sync_n$low"_output" -type f -name '*_v.h5' | head -n 1)"
            high_phi="$(find sync_n$high"_output" -type f -name '*_phi.h5' | head -n 1)"
            high_chi="$(find sync_n$high"_output" -type f -name '*_chi.h5' | head -n 1)"
            high_v="$(find sync_n$high"_output" -type f -name '*_v.h5' | head -n 1)"
            python dark_sector_architecture/qualification/run_qr2_resolution_pair.py \
              --low-phi "$low_phi" \
              --low-chi "$low_chi" \
              --low-velocity "$low_v" \
              --high-phi "$high_phi" \
              --high-chi "$high_chi" \
              --high-velocity "$high_v" \
              --boxsize "$BOXSIZE" \
              --output "dark_sector_architecture/qualification/results/q_r2_sync_n$low"_n"$high.json"
          }
          compare_pair 8 16
          compare_pair 16 32
          compare_pair 32 64

      - name: Add synchronized ladder provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          epoch = float(Path("synchronized_epoch.txt").read_text())
          root = Path("dark_sector_architecture/qualification/results")
          provenance = {
              "seed": 424242,
              "template_source": "gevolution-code/gevolution-1.2/sc1_crystal.dat",
              "template_blob": "d4de9a5400ef58f6a0181fbe61f18056b233a425",
              "gevolution_sha": "0cca42e51a824002ae4fb602cbd79d671e8ffe60",
              "latfield2_sha": "2d8c737ab6adc965a1d2718c209f5085af27b09c",
              "boxsize_mpc_over_h": 64.0,
              "time_step_limit": 0.02,
              "actual_snapshot_redshift": epoch,
              "grids": [8, 16, 32, 64],
              "tiling_factors": [2, 4, 8, 16],
              "particle_counts": [512, 4096, 32768, 262144],
          }

          paths = [
              *(root / f"scalar_weyl_slip_n{n}.json" for n in (8, 16, 32, 64)),
              *(root / f"q_r2_sync_n{a}_n{b}.json" for a, b in ((8,16),(16,32),(32,64))),
          ]
          for path in paths:
              data = json.loads(path.read_text())
              data["synchronized_ladder_provenance"] = provenance
              path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload synchronized ladder artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmology-synchronized-weyl-ladder
          path: |
            synchronized_upstream_revisions.txt
            synchronized_epoch.txt
            gevolution/sync_n8.ini
            gevolution/sync_n16.ini
            gevolution/sync_n32.ini
            gevolution/sync_n64.ini
            sync_n8.log
            sync_n16.log
            sync_n32.log
            sync_n64.log
            sync_n8_output/*_phi.h5
            sync_n8_output/*_chi.h5
            sync_n8_output/*_v.h5
            sync_n8_output/*_B.h5
            sync_n8_output/*_hij.h5
            sync_n16_output/*_phi.h5
            sync_n16_output/*_chi.h5
            sync_n16_output/*_v.h5
            sync_n16_output/*_B.h5
            sync_n16_output/*_hij.h5
            sync_n32_output/*_phi.h5
            sync_n32_output/*_chi.h5
            sync_n32_output/*_v.h5
            sync_n32_output/*_B.h5
            sync_n32_output/*_hij.h5
            sync_n64_output/*_phi.h5
            sync_n64_output/*_chi.h5
            sync_n64_output/*_v.h5
            sync_n64_output/*_B.h5
            sync_n64_output/*_hij.h5
            dark_sector_architecture/qualification/results/scalar_weyl_slip_n8.json
            dark_sector_architecture/qualification/results/scalar_weyl_slip_n16.json
            dark_sector_architecture/qualification/results/scalar_weyl_slip_n32.json
            dark_sector_architecture/qualification/results/scalar_weyl_slip_n64.json
            dark_sector_architecture/qualification/results/q_r2_sync_n8_n16.json
            dark_sector_architecture/qualification/results/q_r2_sync_n16_n32.json
            dark_sector_architecture/qualification/results/q_r2_sync_n32_n64.json
          if-no-files-found: error

      - name: Persist synchronized ladder reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            dark_sector_architecture/qualification/results/scalar_weyl_slip_n8.json \
            dark_sector_architecture/qualification/results/scalar_weyl_slip_n16.json \
            dark_sector_architecture/qualification/results/scalar_weyl_slip_n32.json \
            dark_sector_architecture/qualification/results/scalar_weyl_slip_n64.json \
            dark_sector_architecture/qualification/results/q_r2_sync_n8_n16.json \
            dark_sector_architecture/qualification/results/q_r2_sync_n16_n32.json \
            dark_sector_architecture/qualification/results/q_r2_sync_n32_n64.json
          if git diff --cached --quiet; then
            echo "Synchronized ladder reports unchanged."
            exit 0
          fi
          git commit -m "Persist synchronized scalar-Weyl resolution ladder"
          for attempt in 1 2 3 4 5; do
            git fetch origin dark-sector-stability-architecture
            git rebase origin/dark-sector-stability-architecture
            if git push origin HEAD:dark-sector-stability-architecture; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying."
            sleep 2
          done
          echo "Unable to persist synchronized reports after retries." >&2
          exit 1
