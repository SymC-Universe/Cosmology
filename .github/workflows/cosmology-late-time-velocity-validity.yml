name: Cosmology late-time velocity validity map

on:
  push:
    branches:
      - dark-sector-stability-architecture
    paths:
      - 'dark_sector_architecture/LATE_TIME_VELOCITY_VALIDITY_MAP_PLAN.md'
      - 'dark_sector_architecture/qualification/gevolution_particle_lineage.py'
      - 'dark_sector_architecture/qualification/run_late_time_velocity_validity_map.py'
      - '.github/workflows/cosmology-late-time-velocity-validity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cosmology-late-time-velocity-validity
  cancel-in-progress: true

jobs:
  late-time-velocity-validity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEVOLUTION_SHA: 0cca42e51a824002ae4fb602cbd79d671e8ffe60
      LATFIELD2_SHA: 2d8c737ab6adc965a1d2718c209f5085af27b09c
      TEMPLATE_BLOB: d4de9a5400ef58f6a0181fbe61f18056b233a425

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dark-sector-stability-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openmpi-bin libopenmpi-dev libfftw3-dev libgsl-dev libhdf5-dev
          python -m pip install --upgrade pip
          python -m pip install numpy h5py
      - name: Verify frozen validity plan
        run: |
          git log -1 --format=%H -- dark_sector_architecture/LATE_TIME_VELOCITY_VALIDITY_MAP_PLAN.md \
            | tee late_velocity_plan_commit.txt
      - name: Fetch pinned sources and template
        run: |
          git clone https://github.com/gevolution-code/gevolution-1.3.git gevolution
          git -C gevolution checkout "$GEVOLUTION_SHA"
          git clone https://gitlab.uzh.ch/julian.adamek/LATfield2.git LATfield2
          git -C LATfield2 checkout "$LATFIELD2_SHA"
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/gevolution-code/gevolution-1.2/df8a930732aae1bafa32fd839ee70728bb10773a/sc1_crystal.dat \
            -o gevolution/late_velocity_template.dat
          test "$(git hash-object gevolution/late_velocity_template.dat)" = "$TEMPLATE_BLOB"
      - name: Patch full-precision snapshot logging
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('gevolution/main.cpp')
          text=path.read_text()
          marker=(
              '\t\t// snapshot output\n'
              '\t\tif (snapcount < sim.num_snapshot && '
              '1. / a < sim.z_snapshot[snapcount] + 1.)\n'
          )
          if marker not in text:
              raise SystemExit('snapshot marker missing')
          replacement=(
              '\t\t// snapshot output\n'
              '\t\tif (snapcount < sim.num_snapshot && '
              '1. / a < sim.z_snapshot[snapcount] + 1.)\n'
              '\t\t{\n'
              '\t\t\tchar validity_meta[256];\n'
              '\t\t\tsprintf(validity_meta, '
              '"VEL_VALIDITY_META index=%d cycle=%d a=%.17g z=%.17g '
              'tau_over_boxsize=%.17g", snapcount, cycle, a, (1./a)-1., tau);\n'
              '\t\t\tCOUT << validity_meta << endl;\n'
              '\t\t}\n'
              '\t\tif (snapcount < sim.num_snapshot && '
              '1. / a < sim.z_snapshot[snapcount] + 1.)\n'
          )
          path.write_text(text.replace(marker,replacement,1))
          PY
      - name: Compile gevolution with velocity output
        working-directory: gevolution
        run: |
          make clean
          make -j2 \
            INCLUDE="-I../LATfield2 -I/usr/include/hdf5/serial" \
            LIB="-lfftw3 -lm -L/usr/lib/x86_64-linux-gnu/hdf5/serial -lhdf5 -lgsl -lgslcblas" \
            DGEVOLUTION="-DPHINONLINEAR -DBENCHMARK -DVELOCITY"
      - name: Build frozen N32 and N64 validity settings
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('dark_sector_architecture/qualification/gevolution_modal_pilot.ini').read_text()
          redshifts='5, 2, 1, 0.5, 0.1'
          for n,tiling in ((32,8),(64,16)):
              tag=f'n{n}'
              text=base
              replacements={
                  'template file = pilot_template.dat':'template file = late_velocity_template.dat',
                  'tiling factor = 2':f'tiling factor = {tiling}',
                  'Ngrid = 8':f'Ngrid = {n}',
                  'time step limit = 0.04':'time step limit = 0.02',
                  'output path = ../pilot_output/':f'output path = ../late_velocity_{tag}_output/',
                  'generic file base = modalpilot':f'generic file base = late_velocity_{tag}',
                  'snapshot file base = modalpilot_snap':f'snapshot file base = late_velocity_{tag}_snap',
                  'snapshot redshifts = 99':f'snapshot redshifts = {redshifts}',
                  'snapshot outputs = phi, B, chi, hij, v':'snapshot outputs = v, particles',
                  'Pk file base = modalpilot_pk':f'Pk file base = late_velocity_{tag}_pk',
                  'Pk outputs = phi, B, chi, hij':'Pk outputs = phi',
                  'Pk redshifts = 99':'Pk redshifts = 0.1',
              }
              for old,new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'missing token {old}')
                  text=text.replace(old,new,1)
              Path(f'gevolution/late_velocity_{tag}.ini').write_text(text)
          PY
      - name: Run N32 late-time trajectory
        run: |
          mkdir -p late_velocity_n32_output
          cd gevolution
          mpirun --oversubscribe -np 4 ./gevolution -n 2 -m 2 -s late_velocity_n32.ini | tee ../late_velocity_n32.log
      - name: Run N64 late-time trajectory
        run: |
          mkdir -p late_velocity_n64_output
          cd gevolution
          mpirun --oversubscribe -np 4 ./gevolution -n 2 -m 2 -s late_velocity_n64.ini | tee ../late_velocity_n64.log
      - name: Parse precise metadata and verify five snapshots
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          requested=[5.0,2.0,1.0,0.5,0.1]
          pattern=re.compile(
              r'VEL_VALIDITY_META index=([0-9]+) cycle=([0-9]+) '
              r'a=([0-9eE+.-]+) z=([0-9eE+.-]+) tau_over_boxsize=([0-9eE+.-]+)'
          )
          out=Path('dark_sector_architecture/qualification/results')
          out.mkdir(parents=True,exist_ok=True)
          for n in (32,64):
              tag=f'n{n}'
              matches=pattern.findall(Path(f'late_velocity_{tag}.log').read_text())
              if len(matches)!=5:
                  raise SystemExit(f'N{n}: expected five snapshot metadata lines, got {matches}')
              snaps=[]
              root=Path(f'late_velocity_{tag}_output')
              for j,(idx,cycle,a,z,tau) in enumerate(matches):
                  if int(idx)!=j:
                      raise SystemExit(f'N{n}: snapshot index mismatch')
                  v=list(root.glob(f'*snap{j:03d}_v.h5'))
                  p=list(root.glob(f'*snap{j:03d}_cdm.h5'))
                  if len(v)!=1 or len(p)!=1:
                      raise SystemExit(f'N{n}: missing v/particle files at {j}: {v} {p}')
                  snaps.append({
                      'index':j,
                      'requested_redshift':requested[j],
                      'actual_scale_factor':float(a),
                      'actual_redshift':float(z),
                      'tau_over_boxsize':float(tau),
                      'cycle':int(cycle),
                  })
              meta={
                  'protocol':'P0-Q_LATE_TIME_VELOCITY_VALIDITY_MEMBER',
                  'grid':n,
                  'requested_redshifts':requested,
                  'snapshots':snaps,
                  'seed':424242,
                  'boxsize_mpc_over_h':64.0,
                  'time_step_limit':0.02,
                  'gevolution_sha':'0cca42e51a824002ae4fb602cbd79d671e8ffe60',
                  'latfield2_sha':'2d8c737ab6adc965a1d2718c209f5085af27b09c',
              }
              (out/f'late_velocity_validity_n{n}_metadata.json').write_text(
                  json.dumps(meta,indent=2,sort_keys=True)+'\n'
              )
          PY
      - name: Analyze frozen validity map
        run: |
          python dark_sector_architecture/qualification/run_late_time_velocity_validity_map.py \
            --member 32 late_velocity_n32_output dark_sector_architecture/qualification/results/late_velocity_validity_n32_metadata.json \
            --member 64 late_velocity_n64_output dark_sector_architecture/qualification/results/late_velocity_validity_n64_metadata.json \
            --output dark_sector_architecture/qualification/results/late_time_velocity_validity_map.json
      - name: Add frozen provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('dark_sector_architecture/qualification/results/late_time_velocity_validity_map.json')
          d=json.loads(p.read_text())
          d['frozen_plan_commit']=Path('late_velocity_plan_commit.txt').read_text().strip()
          d['workflow_head']='${{ github.sha }}'
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cosmology-late-time-velocity-validity
          path: |
            late_velocity_plan_commit.txt
            late_velocity_n32.log
            late_velocity_n64.log
            gevolution/late_velocity_n32.ini
            gevolution/late_velocity_n64.ini
            late_velocity_n32_output/*_v.h5
            late_velocity_n32_output/*_cdm.h5
            late_velocity_n64_output/*_v.h5
            late_velocity_n64_output/*_cdm.h5
            dark_sector_architecture/qualification/results/late_velocity_validity_n32_metadata.json
            dark_sector_architecture/qualification/results/late_velocity_validity_n64_metadata.json
            dark_sector_architecture/qualification/results/late_time_velocity_validity_map.json
          if-no-files-found: error
      - name: Persist validity summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            dark_sector_architecture/qualification/results/late_velocity_validity_n32_metadata.json \
            dark_sector_architecture/qualification/results/late_velocity_validity_n64_metadata.json \
            dark_sector_architecture/qualification/results/late_time_velocity_validity_map.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist late-time velocity validity map"
          for attempt in 1 2 3 4 5; do
            git fetch origin dark-sector-stability-architecture
            git rebase origin/dark-sector-stability-architecture
            if git push origin HEAD:dark-sector-stability-architecture; then exit 0; fi
            sleep 2
          done
          exit 1
