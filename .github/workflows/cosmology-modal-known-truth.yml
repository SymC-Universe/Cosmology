name: Cosmology modal known-truth qualification

on:
  push:
    branches:
      - dark-sector-stability-architecture
    paths:
      - 'dark_sector_architecture/qualification/modal_tensor.py'
      - 'dark_sector_architecture/qualification/test_modal_tensor_known_truth.py'
      - 'dark_sector_architecture/qualification/run_modal_known_truth_suite.py'
      - '.github/workflows/cosmology-modal-known-truth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modal-known-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: dark-sector-stability-architecture

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Run known-truth tests
        run: |
          python -m pytest -q dark_sector_architecture/qualification/test_modal_tensor_known_truth.py

      - name: Generate machine-readable qualification report
        run: |
          python dark_sector_architecture/qualification/run_modal_known_truth_suite.py \
            --output dark_sector_architecture/qualification/results/modal_known_truth_report.json

      - name: Upload qualification report
        uses: actions/upload-artifact@v4
        with:
          name: cosmology-modal-known-truth-report
          path: dark_sector_architecture/qualification/results/modal_known_truth_report.json
          if-no-files-found: error

      - name: Persist qualification report to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_sector_architecture/qualification/results/modal_known_truth_report.json
          if git diff --cached --quiet; then
            echo "Qualification report unchanged."
            exit 0
          fi
          git commit -m "Refresh modal known-truth qualification report"
          git push origin HEAD:dark-sector-stability-architecture
