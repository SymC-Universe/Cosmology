name: Cosmology gevolution modal pilot

on:
  push:
    branches:
      - dark-sector-stability-architecture
    paths:
      - 'dark_sector_architecture/qualification/gevolution_modal_pilot.ini'
      - 'dark_sector_architecture/qualification/make_minimal_gadget_template.py'
      - 'dark_sector_architecture/qualification/latfield_hdf5.py'
      - 'dark_sector_architecture/qualification/weak_field_tensors.py'
      - 'dark_sector_architecture/qualification/extract_gevolution_modal_pilot.py'
      - '.github/workflows/cosmology-gevolution-modal-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gevolution-modal-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GEVOLUTION_SHA: 0cca42e51a824002ae4fb602cbd79d671e8ffe60
      LATFIELD2_SHA: 2d8c737ab6adc965a1d2718c209f5085af27b09c

    steps:
      - name: Check out Cosmology repository
        uses: actions/checkout@v4
        with:
          ref: dark-sector-stability-architecture

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            openmpi-bin \
            libopenmpi-dev \
            libfftw3-dev \
            libgsl-dev \
            libhdf5-dev
          python -m pip install --upgrade pip
          python -m pip install numpy h5py

      - name: Fetch pinned gevolution and LATfield2
        run: |
          git clone https://github.com/gevolution-code/gevolution-1.3.git gevolution
          git -C gevolution checkout "$GEVOLUTION_SHA"
          git clone https://gitlab.uzh.ch/julian.adamek/LATfield2.git LATfield2
          git -C LATfield2 checkout "$LATFIELD2_SHA"
          printf 'gevolution=%s\nLATfield2=%s\n' \
            "$(git -C gevolution rev-parse HEAD)" \
            "$(git -C LATfield2 rev-parse HEAD)" \
            | tee upstream_revisions.txt

      - name: Generate deterministic Gadget-2 template
        run: |
          python dark_sector_architecture/qualification/make_minimal_gadget_template.py \
            --output gevolution/pilot_template.dat
          test -s gevolution/pilot_template.dat

      - name: Compile gevolution with velocity output
        working-directory: gevolution
        run: |
          make clean
          make -j2 \
            INCLUDE="-I../LATfield2 -I/usr/include/hdf5/serial" \
            LIB="-lfftw3 -lm -L/usr/lib/x86_64-linux-gnu/hdf5/serial -lhdf5 -lgsl -lgslcblas" \
            DGEVOLUTION="-DPHINONLINEAR -DBENCHMARK -DEXACT_OUTPUT_REDSHIFTS -DVELOCITY"
          test -x gevolution

      - name: Run tiny pinned smoke case
        run: |
          rm -rf pilot_output
          mkdir -p pilot_output
          cp dark_sector_architecture/qualification/gevolution_modal_pilot.ini gevolution/pilot.ini
          cd gevolution
          mpirun -np 1 ./gevolution -n 1 -m 1 -s pilot.ini | tee ../gevolution_modal_pilot.log

      - name: Verify required modal-source fields exist
        run: |
          find pilot_output -maxdepth 2 -type f -printf '%P\n' | sort | tee pilot_output_manifest.txt
          for token in _phi.h5 _B.h5 _chi.h5 _hij.h5 _v.h5; do
            if ! find pilot_output -maxdepth 2 -type f -name "*${token}" | grep -q .; then
              echo "Missing required output token: ${token}" >&2
              exit 1
            fi
          done

      - name: Extract weak-field modal tensors
        run: |
          phi_file="$(find pilot_output -maxdepth 2 -type f -name '*_phi.h5' | sort | head -n 1)"
          velocity_file="$(find pilot_output -maxdepth 2 -type f -name '*_v.h5' | sort | head -n 1)"
          test -n "$phi_file"
          test -n "$velocity_file"
          python dark_sector_architecture/qualification/extract_gevolution_modal_pilot.py \
            --phi "$phi_file" \
            --velocity "$velocity_file" \
            --boxsize 64.0 \
            --summary-output dark_sector_architecture/qualification/results/gevolution_modal_extraction_summary.json \
            --npz-output gevolution_modal_extraction_arrays.npz

      - name: Record qualification metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "stage": "P0-Q",
              "purpose": "gevolution infrastructure/modal-field smoke test",
              "scientific_claim_tested": False,
              "gevolution_sha": "0cca42e51a824002ae4fb602cbd79d671e8ffe60",
              "latfield2_sha": "2d8c737ab6adc965a1d2718c209f5085af27b09c",
              "pilot_grid": 8,
              "initial_redshift": 100.0,
              "final_redshift": 99.0,
              "required_outputs": ["phi", "B", "chi", "hij", "v"],
              "output_manifest": Path("pilot_output_manifest.txt").read_text().splitlines(),
          }
          results = Path("dark_sector_architecture/qualification/results")
          results.mkdir(parents=True, exist_ok=True)
          (results / "gevolution_modal_pilot_metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True)
          )
          (results / "gevolution_modal_pilot_manifest.txt").write_text(
              Path("pilot_output_manifest.txt").read_text()
          )
          PY

      - name: Upload pilot qualification artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmology-gevolution-modal-pilot
          path: |
            upstream_revisions.txt
            gevolution_modal_pilot.log
            pilot_output_manifest.txt
            gevolution_modal_extraction_arrays.npz
            dark_sector_architecture/qualification/results/gevolution_modal_pilot_metadata.json
            dark_sector_architecture/qualification/results/gevolution_modal_pilot_manifest.txt
            dark_sector_architecture/qualification/results/gevolution_modal_extraction_summary.json
          if-no-files-found: error

      - name: Persist pilot metadata, manifest, and extraction summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            dark_sector_architecture/qualification/results/gevolution_modal_pilot_metadata.json \
            dark_sector_architecture/qualification/results/gevolution_modal_pilot_manifest.txt \
            dark_sector_architecture/qualification/results/gevolution_modal_extraction_summary.json
          if git diff --cached --quiet; then
            echo "Pilot qualification results unchanged."
            exit 0
          fi
          git commit -m "Refresh gevolution modal pilot qualification results"
          git push origin HEAD:dark-sector-stability-architecture
