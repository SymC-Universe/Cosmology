name: Cosmology gevolution modal pilot

on:
  push:
    branches:
      - dark-sector-stability-architecture
    paths:
      - 'dark_sector_architecture/qualification/gevolution_modal_pilot.ini'
      - '.github/workflows/cosmology-gevolution-modal-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gevolution-modal-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GEVOLUTION_SHA: 0cca42e51a824002ae4fb602cbd79d671e8ffe60
      LATFIELD2_SHA: b9dcddfc972ba12177e8a92f94394bd8058fde5b

    steps:
      - name: Check out Cosmology repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            openmpi-bin \
            libopenmpi-dev \
            libfftw3-dev \
            libgsl-dev \
            libhdf5-dev

      - name: Fetch pinned gevolution and LATfield2
        run: |
          git clone https://github.com/gevolution-code/gevolution-1.3.git gevolution
          git -C gevolution checkout "$GEVOLUTION_SHA"
          git clone https://github.com/gevolution-code/LATfield2.git LATfield2
          git -C LATfield2 checkout "$LATFIELD2_SHA"
          printf 'gevolution=%s\nLATfield2=%s\n' \
            "$(git -C gevolution rev-parse HEAD)" \
            "$(git -C LATfield2 rev-parse HEAD)" \
            | tee upstream_revisions.txt

      - name: Compile gevolution with velocity output
        working-directory: gevolution
        run: |
          make clean
          make -j2 \
            INCLUDE="-I../LATfield2 -I/usr/include/hdf5/serial" \
            LIB="-lfftw3 -lm -L/usr/lib/x86_64-linux-gnu/hdf5/serial -lhdf5 -lgsl -lgslcblas" \
            DGEVOLUTION="-DPHINONLINEAR -DBENCHMARK -DEXACT_OUTPUT_REDSHIFTS -DVELOCITY"
          test -x gevolution

      - name: Run tiny pinned smoke case
        run: |
          rm -rf pilot_output
          mkdir -p pilot_output
          cp dark_sector_architecture/qualification/gevolution_modal_pilot.ini gevolution/pilot.ini
          cd gevolution
          mpirun -np 1 ./gevolution -n 1 -m 1 -s pilot.ini | tee ../gevolution_modal_pilot.log

      - name: Verify required modal-source fields exist
        run: |
          find pilot_output -maxdepth 2 -type f -printf '%P\n' | sort | tee pilot_output_manifest.txt
          for token in _phi _B _chi _hij _v; do
            if ! find pilot_output -maxdepth 2 -type f -name "*${token}*" | grep -q .; then
              echo "Missing required output token: ${token}" >&2
              exit 1
            fi
          done

      - name: Record qualification metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "stage": "P0-Q",
              "purpose": "gevolution infrastructure/modal-field smoke test",
              "scientific_claim_tested": False,
              "gevolution_sha": "0cca42e51a824002ae4fb602cbd79d671e8ffe60",
              "latfield2_sha": "b9dcddfc972ba12177e8a92f94394bd8058fde5b",
              "required_outputs": ["phi", "B", "chi", "hij", "v"],
              "output_manifest": Path("pilot_output_manifest.txt").read_text().splitlines(),
          }
          Path("gevolution_modal_pilot_metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True)
          )
          PY

      - name: Upload pilot qualification artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmology-gevolution-modal-pilot
          path: |
            upstream_revisions.txt
            gevolution_modal_pilot.log
            pilot_output_manifest.txt
            gevolution_modal_pilot_metadata.json
          if-no-files-found: error
