name: Cosmology Q-R1 extraction convergence baseline

on:
  push:
    branches:
      - dark-sector-stability-architecture
    paths:
      - 'dark_sector_architecture/qualification/run_modal_extraction_convergence.py'
      - 'dark_sector_architecture/qualification/modal_convergence.py'
      - '.github/workflows/cosmology-q-r1-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cosmology-q-r1-run12-baseline
  cancel-in-progress: true

jobs:
  q-r1-run12:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: dark-sector-stability-architecture

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Download frozen run-12 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10941723946/zip" \
            -o run12_artifact.zip
          mkdir run12_artifact
          unzip -q run12_artifact.zip -d run12_artifact
          test -s run12_artifact/gevolution_modal_extraction_arrays.npz

      - name: Recompute Q-R1 from frozen real-field artifact
        run: |
          python dark_sector_architecture/qualification/run_modal_extraction_convergence.py \
            --input-npz run12_artifact/gevolution_modal_extraction_arrays.npz \
            --boxsize 64.0 \
            --factors 2,4 \
            --output dark_sector_architecture/qualification/results/baselines/simple_cubic_512/q_r1_extraction_resolution.json

      - name: Add provenance to Q-R1 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("dark_sector_architecture/qualification/results/baselines/simple_cubic_512/q_r1_extraction_resolution.json")
          data = json.loads(path.read_text())
          data["input_run_id"] = 36350705742
          data["input_artifact_id"] = 10941723946
          data["input_artifact_digest"] = "sha256:106920f81c6dce5560f2ce843fcd3205793ab80ec0590bed8402d017ffa4fb92"
          data["input_head_sha"] = "fe0269cf5241a523e439eaad81fb575af2b804ce"
          data["input_persistence_commit"] = "0603f4ba22a4b29731b0b40f59617eb1c2f6979d"
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload Q-R1 report
        uses: actions/upload-artifact@v4
        with:
          name: cosmology-q-r1-run12
          path: dark_sector_architecture/qualification/results/baselines/simple_cubic_512/q_r1_extraction_resolution.json
          if-no-files-found: error

      - name: Persist Q-R1 report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_sector_architecture/qualification/results/baselines/simple_cubic_512/q_r1_extraction_resolution.json
          if git diff --cached --quiet; then
            echo "Q-R1 report unchanged."
            exit 0
          fi
          git commit -m "Persist run-12 Q-R1 extraction convergence"
          git fetch origin dark-sector-stability-architecture
          git rebase origin/dark-sector-stability-architecture
          git push origin HEAD:dark-sector-stability-architecture
